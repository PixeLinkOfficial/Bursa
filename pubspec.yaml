name: perbeha_rates
description: Perbeha exchange-rate board for Android TV.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# No third-party packages on purpose: rates are stored through a tiny
# platform channel in MainActivity.kt, so the build has nothing to break.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # The font files are downloaded at build time (see .github/workflows/build-apk.yml
  # or build_local.ps1). IBM Plex Sans Arabic, SIL Open Font License.
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
