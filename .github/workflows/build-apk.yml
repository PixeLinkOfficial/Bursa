name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Download Arabic font (IBM Plex Sans Arabic, SIL Open Font License)
        run: |
          mkdir -p assets/fonts
          for w in Regular Medium SemiBold Bold; do
            curl -fsSL -o "assets/fonts/IBMPlexSansArabic-$w.ttf" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-$w.ttf"
          done

      - name: Generate the standard Android project files
        run: |
          flutter create --platforms=android --org com.perbeha --project-name perbeha_rates .
          rm -rf test

      - name: Apply TV settings, icon, banner and splash
        run: cp -r android_overrides/. android/app/src/main/

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perbeha-tv-apk
          path: build/app/outputs/flutter-apk/app-release.apk
